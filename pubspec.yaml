name: fics_app_new
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0' 

dependencies:
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^8.0.0 
  excel: ^4.0.0
  csv: ^6.0.0
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4  
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - lib/data/datasources/tutorials.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false # Deixar false já que não vamos gerar para iPhone agora
  windows:
    generate: true
    image_path: "assets/images/icone_fics.png"

  image_path: "assets/images/icone_fics.png"
  adaptive_icon_background: "assets/images/icone_fics.png" 
  adaptive_icon_foreground: "assets/images/icone_fics.png" 